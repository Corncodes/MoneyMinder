# PostgreSQL configuration for MoneyMinder
# This configuration uses MD5 authentication for better compatibility

# Authentication settings
password_encryption = md5

# Connection settings
listen_addresses = '*'
port = 5432

# Logging
log_statement = 'all'
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 0
log_min_duration_statement = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = -1
